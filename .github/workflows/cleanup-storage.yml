name: Cleanup Actions storage

# Keeps GitHub Actions storage small (the free plan has only 0.5 GB):
#   - deletes old build artifacts (APKs) and keeps only the newest ones
#   - deletes caches
#   - deletes old finished workflow runs (their logs also use space)
# Runs after every build, once a day, and by hand (Actions tab -> Cleanup Actions storage -> Run workflow).
# Your code, releases and commits are never touched.

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      keep_artifacts:
        description: 'How many newest artifacts to keep (0 = delete all)'
        required: false
        default: '1'
      keep_runs:
        description: 'How many newest workflow runs to keep'
        required: false
        default: '5'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-storage
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      KEEP_ARTIFACTS: ${{ github.event.inputs.keep_artifacts || '1' }}
      KEEP_RUNS: ${{ github.event.inputs.keep_runs || '5' }}
    steps:
      - name: Delete old artifacts (keep the newest few)
        run: |
          set -u
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[] | "\(.created_at) \(.id)"' | sort -r | awk '{print $2}')
          total=$(echo "$ids" | grep -c . || true)
          echo "artifacts found: $total, keeping newest $KEEP_ARTIFACTS"
          echo "$ids" | tail -n +$((KEEP_ARTIFACTS + 1)) | while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null && echo "deleted artifact $id" || echo "could not delete artifact $id"
          done

      - name: Delete caches
        run: |
          set -u
          ids=$(gh api --paginate "repos/$REPO/actions/caches?per_page=100" --jq '.actions_caches[].id' || true)
          echo "$ids" | while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/caches/$id" >/dev/null && echo "deleted cache $id" || true
          done

      - name: Delete old finished workflow runs (keep the newest few)
        run: |
          set -u
          ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.status=="completed") | "\(.created_at) \(.id)"' | sort -r | awk '{print $2}')
          echo "$ids" | tail -n +$((KEEP_RUNS + 1)) | while read -r id; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "deleted run $id" || true
          done
