name: trading_bot
description: Modern Trading Bot with real-time data
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  http: ^1.1.0
  web_socket_channel: ^2.4.0
  
  # State Management
  provider: ^6.1.1
  
  # Charts & UI
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  
  # Utilities
  shared_preferences: ^2.2.2

  # AI Report screen: save / share the report file
  share_plus: ^10.1.4   # 7.x was compiled against Android 33 and broke the release build (needs 34+)
  path_provider: ^2.1.2

  # AI Assistant screenshot attach
  image_picker: ^1.0.7

  # Trade sounds (order filled / target hit / stop loss hit) - see lib/services/sound_service.dart
  audioplayers: ^6.1.0
  
  # Modern UI Components
  glassmorphism: ^3.0.0
  animated_bottom_navigation_bar: ^1.2.0
  flutter_svg: ^2.0.9

  # Foreground Service - keeps the app process (and its WebSocket) alive
  # when Android backgrounds/freezes the app instead of letting the OS
  # silently kill it. See lib/services/foreground_service.dart.
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Generates the real launcher icon (mipmap-*/ic_launcher.png) from the
  # owl mascot asset - see .github/workflows/flutter-build.yml, which runs
  # `dart run flutter_launcher_icons` after `flutter create .` regenerates
  # android/ fresh every build (the committed root-level android/ folder is
  # NOT what CI actually builds from).
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/owl_mascot.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
    # Part 11b: the NEW font (IBM Plex Mono, SIL Open Font Licence, assets/fonts/IBMPlexMono-OFL.txt). Inter above is the OLD font and stays.
    # IBM Plex Sans is added by the MERGE-TIME block of README4 (its files are not in this zip); until then Sans falls back to Inter.
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
